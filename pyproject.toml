[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"

[tool.coverage.run]
branch = true
source = ["app", "blueprints", "data", "database", "models", "services", "observability"]
omit = ["tests/*"]

[tool.coverage.report]
show_missing = true
skip_covered = true

[tool.ruff]
target-version = "py310"
line-length = 100
exclude = ["instance", ".venv", "venv"]

[tool.bandit]
exclude_dirs = ["tests", "instance", ".venv", "venv"]
skips = ["B101"]
