name: Deployment smoke

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  gunicorn-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: python -m pip install --upgrade pip
      - name: Install CPU PyTorch
        run: python -m pip install "torch>=2.2,<3" --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install -r requirements.txt
      - name: Apply and verify database migrations
        env:
          FLASK_ENV: production
          SECRET_KEY: ci-only-secret-key-for-production-smoke
          DATABASE_URI: sqlite:///ci-health.db
          MOVIES_CSV: data/movies.csv
          RATINGS_CSV: ""
          RECOMMENDER_ENABLED: "false"
          TMDB_API_KEY: ""
          LOG_FORMAT: json
          APP_VERSION: ci
        run: |
          flask --app app db upgrade
          flask --app app db check
      - name: Validate Gunicorn configuration
        env:
          FLASK_ENV: production
          SECRET_KEY: ci-only-secret-key-for-production-smoke
          DATABASE_URI: sqlite:///ci-health.db
          MOVIES_CSV: data/movies.csv
          RATINGS_CSV: ""
          RECOMMENDER_ENABLED: "false"
          TMDB_API_KEY: ""
          LOG_FORMAT: json
          APP_VERSION: ci
        run: gunicorn --check-config wsgi:app
      - name: Boot and probe production WSGI app
        env:
          FLASK_ENV: production
          SECRET_KEY: ci-only-secret-key-for-production-smoke
          DATABASE_URI: sqlite:///ci-health.db
          MOVIES_CSV: data/movies.csv
          RATINGS_CSV: ""
          RECOMMENDER_ENABLED: "false"
          TMDB_API_KEY: ""
          LOG_FORMAT: json
          APP_VERSION: ci
        run: python scripts/ci_gunicorn_smoke.py
