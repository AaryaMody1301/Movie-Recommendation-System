name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade pip
      - name: Install CPU PyTorch
        run: python -m pip install "torch>=2.2,<3" --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install -r requirements-dev.txt
      - name: Run tests with coverage
        env:
          FLASK_ENV: testing
          RECOMMENDER_ENABLED: "false"
          TMDB_API_KEY: ""
          LOG_FORMAT: text
        run: pytest --cov=app --cov=blueprints --cov=data --cov=database --cov=models --cov=services --cov=observability --cov-report=term-missing

  recommender-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: python -m pip install --upgrade pip
      - name: Install CPU PyTorch
        run: python -m pip install "torch>=2.2,<3" --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install -r requirements.txt
      - name: Exercise real Sentence Transformers boundary
        env:
          HF_HUB_DISABLE_TELEMETRY: "1"
          TOKENIZERS_PARALLELISM: "false"
        run: python scripts/ci_recommender_smoke.py

  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: python -m pip install "ruff>=0.11,<1" "bandit>=1.8,<2"
      - run: python -m compileall -q app.py config.py observability.py wsgi.py blueprints data database models services scripts tests migrations
      - run: ruff check app.py config.py observability.py wsgi.py blueprints data database models services scripts tests migrations --select E9,F63,F7,F82
      - name: Enforce trusted pickle deserialization boundary
        run: python scripts/check_pickle_boundary.py
      - name: Run Bandit medium/high severity scan
        run: bandit -q -r app.py config.py observability.py wsgi.py blueprints data database models services -ll -s B301

  dependency-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: python -m pip install "pip-audit>=2.9,<3"
      - run: pip-audit -r requirements.txt --progress-spinner off
