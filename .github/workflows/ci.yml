name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements-dev.txt
      - name: Run tests with coverage
        env:
          FLASK_ENV: testing
          RECOMMENDER_ENABLED: "false"
          TMDB_API_KEY: ""
          LOG_FORMAT: text
        run: pytest --cov=app --cov=blueprints --cov=data --cov=database --cov=models --cov=services --cov=observability --cov-report=term-missing

  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
      - run: python -m pip install "ruff>=0.11,<1" "bandit>=1.8,<2"
      - run: python -m compileall -q app.py observability.py blueprints data database models services scripts tests
      - run: ruff check app.py observability.py blueprints data database models services scripts tests --select E9,F63,F7,F82
      - name: Enforce trusted pickle deserialization boundary
        run: python scripts/check_pickle_boundary.py
      - name: Run Bandit medium/high severity scan
        run: bandit -q -r app.py observability.py blueprints data database models services -ll -s B301

  dependency-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements.txt
      - run: python -m pip install "pip-audit>=2.9,<3"
      - run: pip-audit -r requirements.txt --progress-spinner off
